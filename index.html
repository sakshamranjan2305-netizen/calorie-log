<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Calorie Log</title>
  <meta name="description" content="Log your meals and track calories, protein, carbs, fat and fibre against your daily goals.">
  <meta name="theme-color" content="#fff8f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1718" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app">
    <main id="view"></main>
    <nav class="tabbar" aria-label="Main">
      <a href="#/day" data-tab="day" data-replace>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v4.5l3 2"/></svg>
        <span>Today</span>
      </a>
      <a href="#/history" data-tab="history" data-replace>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V12M10 20V6M15 20v-9M20 20V9"/></svg>
        <span>History</span>
      </a>
      <a href="#/settings" data-tab="settings" data-replace>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
        <span>Settings</span>
      </a>
    </nav>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
